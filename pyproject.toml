[project]
name = "dog-vision"
version = "0.1.0"
description = "Simulate how dogs and other mammals see colour, on a live camera, a photo or a video"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless"]

[project.urls]
Homepage = "https://github.com/loplex/dog-vision"
Issues = "https://github.com/loplex/dog-vision/issues"

[project.scripts]
dog-vision = "dog_vision.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# uv's own Python builds ship a Tk without Xft, which draws text unantialiased.
python-preference = "system"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.importlinter]
root_package = "dog_vision"

[[tool.importlinter.contracts]]
name = "The command line uses the window, the window the core, never the other way"
type = "layers"
layers = ["dog_vision.cli", "dog_vision.gui", "dog_vision.core"]

[tool.coverage.run]
branch = true
source = ["dog_vision"]
patch = ["subprocess"]  # measure python -m dog_vision run by a test too

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]  # the line length is not checked by default
